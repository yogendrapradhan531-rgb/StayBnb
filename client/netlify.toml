# In Netlify, set "Base directory" to `client` so this file is picked up.
[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: let React Router handle every path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints asset filenames, so they can be cached forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
