# Render Blueprint – deploys the API (and optionally the frontend) from this repo.
# Render dashboard → New → Blueprint → pick your repo.
# Secrets marked `sync: false` are entered in the dashboard, never committed.
services:
  - type: web
    name: staybnb-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false # e.g. https://staybnb.vercel.app (comma-separate multiple)
      - key: CURRENCY
        value: INR
      - key: STRIPE_SECRET_KEY
        sync: false # optional – sk_test_... ; leave empty to disable payments
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # optional – whsec_... from the Stripe webhook endpoint

  # Optional: host the frontend on Render too (instead of Vercel/Netlify)
  - type: web
    name: staybnb-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://staybnb-api.onrender.com/api
      - key: VITE_CURRENCY
        value: INR
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
